apiVersion: v1
kind: Pod
metadata: 
    name: with-node-affinity
spec: 
    affinity:
        nodeAffinity:
            requiredDuringSchedulingIgnoreDuringExecution:
                nodeSelectorTerms:
                -matchExpressions:
                    -key: topology.kubernates.io/zone
                    operator: In
                    values:
                    -antarctica-east1
                    -antarctica-west1
            preferredDuringSchedulingIgnoreDuringExecution:
            -weight: 1
             preference:
                matchExpressions:
                -key: another-node-label-key
                operator: In
                values: 
                -another-node-lable-values
containers:
-name: with-node-affinity
 image: registry.k8s.io/pause:2.0